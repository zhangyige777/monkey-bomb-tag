<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Monkey face -->
  <circle cx="256" cy="220" r="120" fill="#8B6914"/>
  <circle cx="256" cy="240" r="85" fill="#D4A843"/>
  <!-- Eyes -->
  <circle cx="220" cy="210" r="18" fill="white"/>
  <circle cx="292" cy="210" r="18" fill="white"/>
  <circle cx="224" cy="213" r="10" fill="#1a1a1a"/>
  <circle cx="296" cy="213" r="10" fill="#1a1a1a"/>
  <!-- Nose -->
  <ellipse cx="256" cy="245" rx="15" ry="10" fill="#8B6914"/>
  <!-- Mouth -->
  <path d="M 230 260 Q 256 280 282 260" stroke="#8B6914" stroke-width="4" fill="none"/>
  <!-- Ears -->
  <circle cx="155" cy="190" r="30" fill="#8B6914"/>
  <circle cx="155" cy="190" r="18" fill="#D4A843"/>
  <circle cx="357" cy="190" r="30" fill="#8B6914"/>
  <circle cx="357" cy="190" r="18" fill="#D4A843"/>
  <!-- Bomb -->
  <circle cx="370" cy="360" r="55" fill="#1a1a1a"/>
  <ellipse cx="370" cy="345" rx="20" ry="8" fill="#333" opacity="0.5"/>
  <!-- Bomb fuse -->
  <path d="M 395 315 Q 420 290 410 270" stroke="#8B6914" stroke-width="6" fill="none"/>
  <!-- Spark -->
  <circle cx="410" cy="265" r="10" fill="#f59e0b"/>
  <circle cx="410" cy="265" r="5" fill="#ef4444"/>
  <!-- Bomb highlight -->
  <circle cx="355" cy="340" r="12" fill="#444" opacity="0.6"/>
  <!-- Bomb text -->
  <text x="370" y="375" text-anchor="middle" font-family="Arial Black" font-size="28" fill="white" font-weight="bold">BOMB</text>
</svg>
